<!doctype html>
<html lang="ja">
  <head>
    <!-- en twin: index.html. Keep scripts and shared tags in sync; only the copy differs. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>PayPayの取引履歴CSVで家計簿 — 無料・登録不要 | spendlook</title>
    <meta
      name="description"
      content="PayPayアプリの取引履歴CSVを読み込むだけで、月ごとの支出をカテゴリ別にグラフ化する無料の家計簿ダッシュボード。登録不要、データはブラウザ内だけに保存。三菱UFJ銀行など他の銀行CSVにも対応。"
    />
    <link rel="canonical" href="https://spendlook.app/ja" />
    <link rel="alternate" hreflang="en" href="https://spendlook.app/" />
    <link rel="alternate" hreflang="ja" href="https://spendlook.app/ja" />
    <link rel="alternate" hreflang="x-default" href="https://spendlook.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="spendlook" />
    <meta property="og:title" content="PayPayの取引履歴CSVで家計簿 — 無料・登録不要 | spendlook" />
    <meta property="og:description" content="PayPayの取引履歴CSVを読み込むだけの無料家計簿。登録不要、データはブラウザ内だけに保存。" />
    <meta property="og:url" content="https://spendlook.app/ja" />
    <meta property="og:image" content="https://spendlook.app/og.png" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "spendlook",
        "url": "https://spendlook.app/ja",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": ["en", "ja"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" }
      }
    </script>
    <script src="/theme.js"></script>
    <!-- crawler copy in #root: readable by crawlers, never painted (no flash before React mounts) -->
    <style>
      [data-crawler] {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- crawler copy; React replaces it on mount. Keep in step with Intro in src/routes/accounts.tsx -->
      <main data-crawler style="max-width: 72rem; margin: 0 auto; padding: 2rem 1rem">
        <h1>PayPay や銀行の CSV を、そのまま家計簿に</h1>
        <p>spendlook は PayPay の取引履歴 CSV や銀行の明細 CSV を読み込むだけで、月ごとの支出をカテゴリ別にグラフ化する家計簿ダッシュボードです。すべてブラウザ内で動作します。</p>
        <ul>
          <li>無料・登録不要。取引データはこのブラウザの中だけに保存されます。</li>
          <li>PayPay と三菱UFJ銀行に標準対応。そのほかの銀行・電子マネーの CSV も列を指定して読み込めます。</li>
        </ul>
        <p><a href="/paypay-csv">PayPay の取引履歴 CSV をダウンロードする方法</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
